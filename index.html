<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10の状態認知アンケート — HYANG PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #C4923A;
    --moon: #6B7FA3;
    --star: #7A9E7E;
    --bg: #F8F5F0;
    --text: #2A2520;
    --text-light: #8A7E74;
    --border: #E0D8CF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── INTRO ── */
  #intro {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    text-align: center;
  }

  .trinity-emblem {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 1s 0.2s forwards;
  }
  .emblem-icon { font-size: 28px; line-height: 1; }

  #intro h1 {
    font-size: clamp(36px, 8vw, 60px);
    font-weight: 300;
    line-height: 1.4;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 1s 0.4s forwards;
  }
  .h1-num {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    letter-spacing: 0.05em;
  }
  #intro .subtitle {
    font-size: 15px;
    color: var(--text-light);
    letter-spacing: 0.15em;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 1s 0.6s forwards;
  }
  #intro p.desc {
    font-size: 18px;
    color: var(--text-light);
    line-height: 2;
    max-width: 380px;
    margin-bottom: 56px;
    font-weight: 200;
    opacity: 0;
    animation: fadeUp 1s 0.8s forwards;
  }
  .btn-start {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 18px 52px;
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: opacity 0.3s;
    opacity: 0;
    animation: fadeUp 1s 1s forwards;
  }
  .btn-start:hover { opacity: 0.75; }

  /* ── INFO FORM ── */
  #infoForm {
    display: none;
    min-height: 100vh;
    padding: 60px 24px 80px;
    max-width: 500px;
    margin: 0 auto;
  }

  .form-header { margin-bottom: 40px; animation: fadeUp 0.5s forwards; }
  .form-header .step-label { font-size: 14px; letter-spacing: 0.3em; color: var(--text-light); margin-bottom: 12px; }
  .form-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 300; line-height: 1.4; }

  .field { margin-bottom: 28px; animation: fadeUp 0.5s forwards; }
  .field label { display: block; font-size: 14px; letter-spacing: 0.2em; color: var(--text-light); margin-bottom: 10px; }
  .field input {
    width: 100%;
    background: white;
    border: 1px solid var(--border);
    padding: 16px 18px;
    font-family: 'Noto Serif JP', serif;
    font-size: 18px;
    font-weight: 300;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .field input:focus { border-color: var(--text); }
  .field input::placeholder { color: var(--border); }

  .age-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .age-btn {
    background: white;
    border: 1px solid var(--border);
    padding: 16px 6px;
    font-family: 'Noto Serif JP', serif;
    font-size: 16px;
    font-weight: 300;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.4;
  }
  .age-btn:hover { border-color: var(--text); }
  .age-btn.selected { background: var(--text); color: var(--bg); border-color: var(--text); }

  .field-note { font-size: 13px; color: var(--text-light); margin-top: 8px; letter-spacing: 0.05em; line-height: 1.6; }

  .btn-next {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 18px;
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    letter-spacing: 0.2em;
    cursor: pointer;
    margin-top: 16px;
    transition: opacity 0.3s;
  }
  .btn-next:hover { opacity: 0.75; }

  .error-msg { font-size: 14px; color: #B85C5C; margin-top: 8px; display: none; letter-spacing: 0.05em; }
  .field-error { font-size: 13px; color: #B85C5C; margin-top: 6px; display: none; letter-spacing: 0.05em; }
  .field input.invalid { border-color: #B85C5C; }

  /* ── SURVEY ── */
  #survey { display: none; padding: 40px 24px 80px; max-width: 600px; margin: 0 auto; }

  .progress-wrap { margin-bottom: 40px; }
  .progress-bar { height: 2px; background: var(--border); }
  .progress-fill { height: 100%; background: var(--text); transition: width 0.5s ease; width: 0%; }
  .progress-text { font-size: 13px; color: var(--text-light); letter-spacing: 0.15em; margin-top: 10px; text-align: right; }

  .question-block { animation: fadeUp 0.4s forwards; }

  .q-number { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--text-light); letter-spacing: 0.3em; margin-bottom: 20px; }
  .q-text { font-size: 22px; font-weight: 300; line-height: 1.7; margin-bottom: 36px; }

  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }

  .option-btn {
    background: white;
    border: 1px solid var(--border);
    padding: 20px 22px;
    text-align: left;
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    font-weight: 300;
    color: var(--text);
    cursor: pointer;
    transition: all 0.25s;
    line-height: 1.6;
    width: 100%;
  }
  .option-btn:hover { border-color: var(--text); background: #FFFDF9; }
  .option-btn.selected { background: var(--text); color: var(--bg); border-color: var(--text); }

  .option-label { font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.2em; opacity: 0.5; display: block; margin-bottom: 4px; }

  .nav-row { display: flex; align-items: center; gap: 16px; }
  .btn-prev {
    background: none;
    border: 1px solid var(--border);
    padding: 14px 24px;
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-prev:hover { border-color: var(--text); color: var(--text); }
  .btn-prev:disabled { opacity: 0.2; cursor: not-allowed; }
  .nav-hint { font-size: 14px; color: var(--text-light); }

  /* ── RESULT ── */
  #result { display: none; min-height: 100vh; }

  .result-hero { padding: 80px 24px 60px; text-align: center; }
  .result-hero.sun-result { background: #FDF7EE; }
  .result-hero.moon-result { background: #EEF1F8; }
  .result-hero.star-result { background: #EEF4EE; }
  .result-hero.balance-result { background: #F8F5F0; }

  .result-symbol { font-size: 60px; margin-bottom: 24px; display: block; animation: floatSymbol 3s ease-in-out infinite; }
  .result-type-label { font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.4em; color: var(--text-light); margin-bottom: 16px; }
  .result-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(38px, 9vw, 64px); font-weight: 300; line-height: 1.2; margin-bottom: 8px; }
  .result-sub { font-size: 16px; color: var(--text-light); letter-spacing: 0.1em; margin-bottom: 48px; }

  .score-row { display: flex; justify-content: center; gap: 32px; }
  .score-item { text-align: center; }
  .score-icon { font-size: 24px; display: block; margin-bottom: 6px; }
  .score-bar-wrap { width: 60px; height: 3px; background: var(--border); margin: 0 auto 6px; position: relative; }
  .score-bar { height: 100%; position: absolute; left: 0; top: 0; transition: width 1s 0.5s ease; width: 0; }
  .score-bar.sun { background: var(--sun); }
  .score-bar.moon { background: var(--moon); }
  .score-bar.star { background: var(--star); }
  .score-num { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--text-light); }

  .result-body { padding: 48px 24px 80px; max-width: 560px; margin: 0 auto; }
  .result-name { font-size: 16px; color: var(--text-light); letter-spacing: 0.1em; margin-bottom: 32px; }
  .result-section { margin-bottom: 48px; }
  .result-section-label { font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: var(--text-light); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .result-desc { font-size: 18px; font-weight: 300; line-height: 2.2; color: var(--text); margin-bottom: 24px; border-left: 2px solid var(--border); padding-left: 24px; }
  .result-insight { background: white; border: 1px solid var(--border); padding: 28px; margin-bottom: 0; }
  .insight-title { font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 0.3em; color: var(--text-light); margin-bottom: 16px; }
  .insight-text { font-size: 17px; font-weight: 300; line-height: 2; color: var(--text); }

  .brand-footer { text-align: center; padding: 40px 24px; border-top: 1px solid var(--border); }
  .brand-tagline { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-style: italic; color: var(--text-light); line-height: 1.8; }
  .brand-name { font-size: 13px; letter-spacing: 0.4em; color: var(--text-light); margin-top: 16px; }
  .btn-store {
    display: block;
    background: var(--text);
    color: var(--bg);
    text-decoration: none;
    padding: 18px 36px;
    font-family: 'Noto Serif JP', serif;
    font-size: 16px;
    letter-spacing: 0.15em;
    margin-top: 32px;
    text-align: center;
    transition: opacity 0.3s;
  }
  .btn-store:hover { opacity: 0.75; }
  .btn-retry { background: none; border: 1px solid var(--border); padding: 14px 36px; font-family: 'Noto Serif JP', serif; font-size: 15px; letter-spacing: 0.2em; color: var(--text-light); cursor: pointer; margin-top: 16px; transition: all 0.3s; display: inline-block; }
  .btn-retry:hover { border-color: var(--text); color: var(--text); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatSymbol {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
</style>
</head>
<body>

<!-- INTRO -->
<section id="intro">
  <div class="trinity-emblem">
    <span class="emblem-icon">☀️</span>
    <span class="emblem-icon">🌙</span>
    <span class="emblem-icon">⭐</span>
  </div>
  <h1>
    <span class="h1-num">10</span>の状態認知<br>アンケート
  </h1>
  <p class="subtitle">THE TRINITY SCENT SYSTEM</p>

  <button class="btn-start" onclick="showInfoForm()">アンケートを始める</button>
</section>

<!-- INFO FORM -->
<section id="infoForm">
  <div class="form-header">
    <p class="step-label">STEP 01 — 基本情報</p>
    <h2>まず簡単な<br>情報を教えてください</h2>
  </div>

  <div class="field">
    <label>お名前 *</label>
    <input type="text" id="inputName" placeholder="山田太郎" oninput="validateName(this)" />
    <p class="field-error" id="nameError">お名前を正しく入力してください</p>
  </div>

  <div class="field">
    <label>年代 *</label>
    <div class="age-grid" id="ageGrid">
      <button class="age-btn" onclick="selectAge(this, '10代')">10代</button>
      <button class="age-btn" onclick="selectAge(this, '20代')">20代</button>
      <button class="age-btn" onclick="selectAge(this, '30代')">30代</button>
      <button class="age-btn" onclick="selectAge(this, '40代')">40代</button>
      <button class="age-btn" onclick="selectAge(this, '50代')">50代</button>
      <button class="age-btn" onclick="selectAge(this, '60代')">60代</button>
      <button class="age-btn" onclick="selectAge(this, '70代')">70代</button>
      <button class="age-btn" onclick="selectAge(this, 'それ以上')">それ以上</button>

  <div class="field">

    <input type="text" id="inputPhone" placeholder="メールアドレスまたは電話番号" />
    <p class="field-note">※ 収集した情報はアンケート分析以外の目的に使用しません</p>
  </div>

  <p class="error-msg" id="formError">必須項目を確認してください。</p>
  <button class="btn-next" onclick="startSurvey()">アンケートを始める →</button>
</section>

<!-- SURVEY -->
<section id="survey">
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <p class="progress-text" id="progressText">1 / 10</p>
  </div>
  <div id="questionContainer"></div>
</section>

<!-- RESULT -->
<section id="result">
  <div class="result-hero" id="resultHero">
    <span class="result-symbol" id="resultSymbol"></span>
    <p class="result-type-label" id="resultLabel"></p>
    <h2 class="result-title" id="resultTitle"></h2>
    <p class="result-sub" id="resultSub"></p>
    <div class="score-row">
      <div class="score-item">
        <span class="score-icon">☀️</span>
        <div class="score-bar-wrap"><div class="score-bar sun" id="barSun"></div></div>
        <span class="score-num" id="numSun">0</span>
      </div>
      <div class="score-item">
        <span class="score-icon">🌙</span>
        <div class="score-bar-wrap"><div class="score-bar moon" id="barMoon"></div></div>
        <span class="score-num" id="numMoon">0</span>
      </div>
      <div class="score-item">
        <span class="score-icon">⭐</span>
        <div class="score-bar-wrap"><div class="score-bar star" id="barStar"></div></div>
        <span class="score-num" id="numStar">0</span>
      </div>
    </div>
  </div>

  <div class="result-body" id="resultBody">
    <p class="result-name" id="resultName"></p>
  </div>

  <div class="brand-footer">
    <p class="brand-tagline">香りは私を変えない。<br>ただ、また私自身へと連れ戻してくれる。</p>
    <p class="brand-name">HYANG PRO</p>
    <br>
    <button class="btn-retry" onclick="resetSurvey()">もう一度</button>
  </div>
</section>

  ]},
  { q: "一日を終え、一人でいるとき", options: [
    { label: "A", text: "明日の計画を整理する", type: "A" },
    { label: "B", text: "溜まっていた感情が溢れてくる", type: "B" },
    { label: "C", text: "今日の会話がずっと頭に浮かぶ", type: "C" }

  { q: "今の自分に最も必要なものは", options: [

    { label: "B", text: "休みながら自分を大切にすべき時期", type: "B" },
    { label: "C", text: "不要な約束や集まりを減らすべき時期", type: "C" }
  ]},
  { q: "今の自分に必要な回復の方法は", options: [
    { label: "A", text: "思考が整理され、方向性がはっきりすること", type: "A" },
    { label: "B", text: "緊張がほぐれ、安定が戻ること", type: "B" },
    { label: "C", text: "関係の中で自分の軸とバランスが取り戻せること", type: "C" }
  ]},
  { q: "今、自分はどのように動きたいか", options: [

    { label: "B", text: "少し立ち止まり、自分を回復させたい", type: "B" },
    { label: "C", text: "関係の中でバランスを整えたい", type: "C" }
  ]}
];

const results = {
  A: {
    heroClass: "sun-result", symbol: "☀️", label: "SUN — 太陽", title: "方向の私", titleKr: "방향의 나",

    insight: "この流れは、私の方向感が生きているサインです。ただ、前だけを見て通り過ぎてきたものがあれば、その場所を一度振り返ってもいい時期かもしれません。"

    sub: "今、月の私が前に出ています",
    desc: "今の私は、状態と感情により近いところにいます。回復、安定、自分を大切にする感覚が必要な時期です。このような流れは、感覚が豊かな人、または多くのことを受け入れている時期にある人に現れます。",
    insight: "この時期は弱さではありません。自分を大切にすることが最も重要になる瞬間があります。今がまさにその時期かもしれません。"
  },

    sub: "今、星の私が前に出ています",
    desc: "今の私は、関係と役割の接点の中で動いています。人との流れ、場での役割、社会的な位置が私を導いています。このような流れは、さまざまな関係の中でバランスを取る必要がある立場にいる人に現れます。",
    insight: "関係の中で自分を失わないことが大切な時期です。自分の軸を保ちながら関係を続ける方法を見つけていく途中です。"

  BALANCE: {
    heroClass: "balance-result", symbol: "✦", label: "TRINITY — バランス", title: "バランスの私", titleKr: "균형의 나",
    sub: "三つが均等に出ています",
    desc: "三つが似たように出たなら、バランスを保とうと生きている人です。方向と感情と関係を同時に保っている状態です。",
    insight: "三つすべてを持って生きることは簡単なことではありません。今の私はそのすべてを一緒に抱えているところです。"
  }
};

let userInfo = { name: '', age: '', contact: '' };
let selectedAge = '';
let answers = [];
let current = 0;

function validateName(input) {
  const val = input.value.trim();
  const valid = /^[぀-ゟ゠-ヿ一-龯＀-￯a-zA-Z\s]{1,30}$/.test(val);
  const errEl = document.getElementById('nameError');
  if (val && !valid) {
    input.classList.add('invalid');
    errEl.style.display = 'block';
  } else {
    input.classList.remove('invalid');
    errEl.style.display = 'none';
  }
}

function showInfoForm() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('infoForm').style.display = 'block';
  window.scrollTo(0, 0);
}

function selectAge(btn, age) {
  document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedAge = age;
  document.getElementById('ageError').style.display = 'none';
}

function startSurvey() {
  const nameInput = document.getElementById('inputName');
  const name = nameInput.value.trim();
  let valid = true;

  if (!name) {
    nameInput.classList.add('invalid');
    document.getElementById('nameError').style.display = 'block';
    valid = false;
  }
  if (!selectedAge) {
    document.getElementById('ageError').style.display = 'block';
    valid = false;
  }
  if (!valid) return;

  document.getElementById('formError').style.display = 'none';
  userInfo.name = name;
  userInfo.age = selectedAge;
  userInfo.contact = document.getElementById('inputPhone').value.trim();

  answers = new Array(questions.length).fill(null);
  current = 0;

  document.getElementById('infoForm').style.display = 'none';
  document.getElementById('survey').style.display = 'block';
  renderQuestion(0);
  window.scrollTo(0, 0);
}

function renderQuestion(idx) {
  const q = questions[idx];
  const answered = answers[idx];
  document.getElementById('progressFill').style.width = `${(idx / questions.length) * 100}%`;
  document.getElementById('progressText').textContent = `${idx + 1} / ${questions.length}`;

  document.getElementById('questionContainer').innerHTML = `
    <div class="question-block">
      <p class="q-number">Q ${String(idx + 1).padStart(2, '0')} / 10</p>
      <p class="q-text">${q.q}</p>
      <div class="options">
        ${q.options.map(o => `
          <button class="option-btn ${answered === o.type ? 'selected' : ''}"
            onclick="selectAnswer('${o.type}', this)">
            <span class="option-label">${o.label}</span>${o.text}
          </button>
        `).join('')}
      </div>
      <div class="nav-row">
        <button class="btn-prev" onclick="goPrev()" ${idx === 0 ? 'disabled' : ''}>← 前の質問</button>
        <p class="nav-hint">${answered ? '別の項目を選ぶと変更されます' : '選択すると自動で次へ進みます'}</p>
      </div>
    </div>
  `;
}

function selectAnswer(type, btn) {
  if (btn.closest('.question-block').dataset.transitioning) return;
  btn.closest('.question-block').dataset.transitioning = 'true';

  document.querySelectorAll('.option-btn').forEach(b => {
    b.classList.remove('selected');
    b.disabled = true;
  });
  btn.classList.add('selected');
  answers[current] = type;

  setTimeout(() => {
    current++;
    if (current < questions.length) {
      renderQuestion(current);
      window.scrollTo(0, 0);
    } else {
      showResult();
    }
  }, 380);
}

function goPrev() {
  if (current > 0) {
    current--;
    renderQuestion(current);
    window.scrollTo(0, 0);
  }
}

function renderResultBody(rList) {
  const name = userInfo.name;
  let html = `<p class="result-name">${name} さんの結果</p>`;

  rList.forEach(r => {
    html += `
      <div class="result-section">
        <p class="result-section-label">${r.symbol} ${r.label}</p>
        <p class="result-desc">${r.desc}</p>
        <div class="result-insight">
          <p class="insight-title">INSIGHT</p>
          <p class="insight-text">${r.insight}</p>
        </div>
      </div>
    `;
  });

  html += `<a href="https://smartstore.naver.com/hyangpro" target="_blank" class="btn-store">自分に合う香りを探す</a>`;
  document.getElementById('resultBody').innerHTML = html;
}

function showResult() {
  document.getElementById('survey').style.display = 'none';
  document.getElementById('result').style.display = 'block';

  const count = { A: 0, B: 0, C: 0 };
  answers.forEach(a => { if (a) count[a]++; });

  const max = Math.max(count.A, count.B, count.C);
  const winners = Object.keys(count).filter(k => count[k] === max);
  const allSimilar = Object.values(count).every(v => Math.abs(v - max) <= 1);

  let resultTitleForSheet;

  if (allSimilar && winners.length > 1) {
    const r = results['BALANCE'];
    document.getElementById('resultHero').className = `result-hero ${r.heroClass}`;
    document.getElementById('resultSymbol').textContent = r.symbol;
    document.getElementById('resultLabel').textContent = r.label;
    document.getElementById('resultTitle').textContent = r.title;
    document.getElementById('resultSub').textContent = r.sub;
    renderResultBody([r]);
    resultTitleForSheet = r.titleKr;
  } else if (winners.length === 2) {
    const r1 = results[winners[0]];
    const r2 = results[winners[1]];
    document.getElementById('resultHero').className = `result-hero balance-result`;
    document.getElementById('resultSymbol').textContent = `${r1.symbol} ${r2.symbol}`;
    document.getElementById('resultLabel').textContent = `${r1.label}  ·  ${r2.label}`;
    document.getElementById('resultTitle').textContent = `${r1.title} & ${r2.title}`;
    document.getElementById('resultSub').textContent = '今、二つの私が共に出ています';
    renderResultBody([r1, r2]);
    resultTitleForSheet = `${r1.titleKr} & ${r2.titleKr}`;
  } else {
    const r = results[winners[0]];
    document.getElementById('resultHero').className = `result-hero ${r.heroClass}`;
    document.getElementById('resultSymbol').textContent = r.symbol;
    document.getElementById('resultLabel').textContent = r.label;
    document.getElementById('resultTitle').textContent = r.title;
    document.getElementById('resultSub').textContent = r.sub;
    renderResultBody([r]);
    resultTitleForSheet = r.titleKr;
  }

  document.getElementById('numSun').textContent = count.A;
  document.getElementById('numMoon').textContent = count.B;
  document.getElementById('numStar').textContent = count.C;

  setTimeout(() => {
    document.getElementById('barSun').style.width = `${(count.A / 10) * 100}%`;
    document.getElementById('barMoon').style.width = `${(count.B / 10) * 100}%`;
    document.getElementById('barStar').style.width = `${(count.C / 10) * 100}%`;
  }, 300);

  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTSZg2Zc0PTRcPxSy7owjHqQcuNHYImmMb_hFmeoUvPlhss1rVEDkDbdylygaHSHZA/exec';
  const formData = new FormData();
  formData.append('data', JSON.stringify({
    name: userInfo.name,
    age: userInfo.age,
    phone: userInfo.contact,
    result: resultTitleForSheet,
    countA: count.A,
    countB: count.B,
    countC: count.C
  }));
  fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData })
    .catch(err => console.log('送信エラー:', err));

  window.scrollTo(0, 0);
}

function resetSurvey() {
  answers = []; current = 0; selectedAge = '';
  userInfo = { name: '', age: '', contact: '' };
  document.getElementById('inputName').value = '';
  document.getElementById('inputPhone').value = '';
  document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('result').style.display = 'none';
  document.getElementById('intro').style.display = 'flex';
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
